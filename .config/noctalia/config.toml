[bar.default]
center = [ "control-center", "clock" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_edge = 5
margin_ends = 5
radius = 10
start = [ "launcher", "wallpaper", "workspaces", "audio_visualizer", "media" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.animation]
enabled = false
speed = 0.10000000149011612

[theme]
builtin = "Nord"

[wallpaper]
directory = "/home/vylpes/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/vylpes/Pictures/Wallpapers/super-mario-odyssey-3.jpg"

    [wallpaper.last]
    path = "/home/vylpes/Pictures/Wallpapers/super-mario-odyssey-3.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/vylpes/Pictures/Wallpapers/super-mario-odyssey-3.jpg"

[widget.audio_visualizer]
bands = 8

[widget.media]
artist_first = true
hide_when_no_media = true

[widget.network]
show_label = false
